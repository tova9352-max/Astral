name: RED MEMORY Android APK

on:
  push:
    branches: [main]
    paths:
      - 'RED-MEMORY-alpha01-source.zip.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract source project
        run: |
          mkdir -p source
          base64 -d RED-MEMORY-alpha01-source.zip.b64 > /tmp/red-memory.zip
          unzip -q /tmp/red-memory.zip -d source

      - name: Build debug APK
        run: gradle -p source/RED-MEMORY :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RED-MEMORY-alpha01-debug-apk
          path: source/RED-MEMORY/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
